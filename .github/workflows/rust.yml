name: Rust engine checks

on:
  push:
    paths:
      - "JS/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "JS/**"
      - ".github/workflows/rust.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run engine tests
        run: cargo test --manifest-path JS/Cargo.toml
